<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Kodable Creator Rig</title>
    <style>
      :root {
        color-scheme: light dark;
        --ink: #1a2142;
        --muted: #6b7190;
        --line: #d6dae8;
        --bg: #f4f5f9;
        --surface: #ffffff;
        --accent: #ffb40f;
        --ok: #3e8f2a;
        --bad: #b23a3a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #e7e9f4;
          --muted: #9aa1c0;
          --line: #2c3560;
          --bg: #0f1428;
          --surface: #171e3a;
          --ok: #8ed677;
          --bad: #f08a8a;
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: var(--bg);
        color: var(--ink);
        font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #index { max-width: 900px; margin: 0 auto; padding: 24px 16px 64px; }
      #index h1 { font-size: 22px; margin: 0 0 4px; }
      #index p { color: var(--muted); margin: 0 0 16px; max-width: 70ch; }
      #index label { display: inline-flex; gap: 8px; align-items: center; margin: 0 16px 16px 0; }
      #index input, #index select {
        font: inherit; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px;
        background: var(--surface); color: var(--ink);
      }
      .scenario { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; }
      .scenario h2 { font-size: 16px; margin: 0 0 4px; }
      .scenario .desc { color: var(--muted); margin: 0 0 8px; }
      .variants { display: flex; flex-wrap: wrap; gap: 8px; }
      .variants a {
        display: inline-block; padding: 6px 10px; border-radius: 999px; text-decoration: none;
        background: var(--accent); color: #1a2142; font-weight: 600; font-size: 13px;
      }
      #stage { position: fixed; inset: 0; display: none; background: #000; }
      #game { position: absolute; inset: 0; }
      #hud {
        position: fixed; top: 8px; left: 8px; z-index: 10; padding: 6px 10px; border-radius: 6px;
        background: rgba(0,0,0,0.6); color: #fff; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        pointer-events: none; white-space: pre;
      }
      #report {
        position: fixed; left: 8px; right: 8px; bottom: 8px; z-index: 10; max-height: 45vh; overflow: auto;
        margin: 0; padding: 10px 12px; border-radius: 8px; display: none;
        background: rgba(255,255,255,0.94); color: #1a2142;
        font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap;
      }
      #report.pass { border: 3px solid var(--ok); }
      #report.fail { border: 3px solid var(--bad); }
      #report.na { border: 3px solid var(--accent); }
      #report-actions {
        position: fixed; top: 8px; left: 50%; transform: translateX(-50%); z-index: 11; display: none; gap: 8px;
      }
      #report-actions button, #report-actions .button {
        display: inline-block; font: 600 14px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 10px 14px;
        border: 0; border-radius: 999px; background: var(--accent); color: #1a2142; cursor: pointer; text-decoration: none;
      }
      #report-actions { flex-wrap: wrap; justify-content: center; max-width: 90vw; }
      /* CW-01.7 editor overlay */
      .ov-root { position: absolute; inset: 0; z-index: 5; touch-action: none; user-select: none; -webkit-user-select: none; }
      .ov-react { position: absolute; inset: 0; pointer-events: none; }
      .ov-react .ov-panel, .ov-react .ov-rail { pointer-events: auto; }
      .ov-canvas-layer { position: absolute; left: 0; top: 0; pointer-events: none; }
      .ov-canvas-layer .ov-handle { pointer-events: auto; }
      .ov-rail {
        position: absolute; left: 0; top: 0; bottom: 0; width: 56px; display: flex; flex-direction: column; gap: 8px; padding: 48px 8px 8px;
        background: rgba(23,30,58,0.94); border-right: 1px solid var(--line); color: #e7e9f4;
      }
      .ov-tool { width: 40px; height: 40px; border: 0; border-radius: 8px; background: #2c3560; color: #fff; font: 600 12px/1 -apple-system, sans-serif; }
      .ov-rail-info { margin-top: auto; font: 11px/1.4 ui-monospace, Menlo, monospace; color: #9aa1c0; }
      .ov-panel {
        position: absolute; right: 0; top: 0; bottom: 0; width: 280px; overflow: auto; padding: 48px 12px 12px;
        background: rgba(23,30,58,0.94); border-left: 1px solid var(--line); color: #e7e9f4; font: 13px/1.4 -apple-system, sans-serif;
      }
      .ov-panel h3 { font-size: 13px; margin: 8px 0 6px; color: #9aa1c0; text-transform: uppercase; letter-spacing: 0.04em; }
      .ov-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
      .ov-fields label { display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: #9aa1c0; }
      .ov-fields input { width: 100%; font: 13px ui-monospace, Menlo, monospace; padding: 4px 6px; border: 1px solid #2c3560; border-radius: 6px; background: #0f1428; color: #e7e9f4; }
      .ov-muted { color: #9aa1c0; }
      .ov-list { display: flex; flex-direction: column; gap: 2px; max-height: 40vh; overflow: auto; }
      .ov-row { text-align: left; border: 0; border-radius: 6px; padding: 5px 8px; background: transparent; color: #e7e9f4; font: 12px ui-monospace, Menlo, monospace; }
      .ov-row-selected { background: var(--accent); color: #1a2142; }
      .ov-gizmo { position: absolute; left: 0; top: 0; box-sizing: border-box; border: 2px solid var(--accent); pointer-events: none; transform-origin: center; }
      .ov-handle { position: absolute; width: 14px; height: 14px; margin: -7px; background: #fff; border: 2px solid var(--accent); border-radius: 3px; pointer-events: auto; }
      .ov-handle-nw { left: 0; top: 0; } .ov-handle-n { left: 50%; top: 0; } .ov-handle-ne { left: 100%; top: 0; } .ov-handle-e { left: 100%; top: 50%; }
      .ov-handle-se { left: 100%; top: 100%; } .ov-handle-s { left: 50%; top: 100%; } .ov-handle-sw { left: 0; top: 100%; } .ov-handle-w { left: 0; top: 50%; }
      .ov-handle-rotate { left: 50%; top: -28px; border-radius: 50%; background: var(--accent); }
      #hash {
        position: fixed; top: 8px; right: 8px; z-index: 10; padding: 8px 12px; border-radius: 8px; display: none;
        background: rgba(255,255,255,0.94); color: #1a2142; font: 700 28px/1.1 ui-monospace, Menlo, monospace;
      }
    </style>
  </head>
  <body>
    <main id="index" hidden></main>
    <div id="stage">
      <div id="game"></div>
      <div id="hud"></div>
      <div id="hash"></div>
      <div id="report-actions"></div>
      <pre id="report"></pre>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
